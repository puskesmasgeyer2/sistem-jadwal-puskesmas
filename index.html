
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#087f5b">
  <title>Sistem Jadwal | UPTD Puskesmas Geyer 2</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --green: #087f5b;
      --green-dark: #056448;
      --text: #172b43;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #edf5f7;
    }

    /* BAGIAN HEADER */
    .hero {
      position: relative;
      overflow: hidden;
      min-height: 285px;
      padding: 24px 16px 25px;
      text-align: center;
      color: white;
      background:
        radial-gradient(ellipse at 50% -80%, #42b994 0%, transparent 70%),
        linear-gradient(135deg, #087f5b, #056448);
      border-radius: 0 0 9% 9% / 0 0 12% 12%;
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      pointer-events: none;
      width: 42%;
      height: 125%;
      top: -30%;
      border: 30px solid rgba(255,255,255,.13);
      border-radius: 0 0 100% 0;
      transform: rotate(-12deg);
    }

    .hero::before {
      left: -19%;
    }

    .hero::after {
      right: -19%;
      transform: scaleX(-1) rotate(-12deg);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .logo {
      display: block;
      width: 105px;
      height: 105px;
      object-fit: contain;
      margin: 0 auto 8px;
      filter: drop-shadow(0 3px 5px rgba(0,0,0,.12));
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 44px);
      line-height: 1.15;
      font-weight: 800;
      letter-spacing: .3px;
    }

    .institution {
      margin-top: 8px;
      font-size: clamp(19px, 3.2vw, 29px);
      line-height: 1.3;
      font-weight: 800;
      letter-spacing: .5px;
    }

    /* LATAR BELAKANG FOTO PUSKESMAS */
    .page-background {
      position: relative;
      isolation: isolate;
      min-height: calc(100vh - 285px);
      padding: 30px 16px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;

        linear-gradient(

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* KARTU LOGIN */
    .card {
      width: min(100%, 575px);
      padding: 32px 38px;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 19px;
      box-shadow: 0 10px 32px rgba(23, 55, 68, .15);
      backdrop-filter: blur(5px);
    }

    h2 {
      margin: 0 0 14px;
      font-size: 29px;
      line-height: 1.2;
      font-weight: 800;
    }

    .muted {
      margin: 0 0 18px;
      color: #607187;
      font-size: 16px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-size: 16px;
      font-weight: 700;
    }

    input {
      display: block;
      width: 100%;
      min-height: 53px;
      padding: 13px 15px;
      border: 1px solid #cbd7e3;
      border-radius: 11px;
      outline: none;
      background: #fff;
      color: #172b43;
      font-family: inherit;
      font-size: 16px;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(8,127,91,.12);
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 78px;
    }

    .toggle-password {
      position: absolute;
      right: 7px;
      top: 7px;
      width: auto;
      min-height: 39px;
      margin: 0;
      padding: 7px 10px;
      border: 0;
      background: #edf7f3;
      color: var(--green-dark);
      font-size: 12px;
      font-weight: 700;
    }

    button {
      width: 100%;
      min-height: 55px;
      margin-top: 22px;
      padding: 14px 18px;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(100deg, #07865f, #087f5b);
      color: white;
      font-family: inherit;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: filter .2s, transform .2s;
    }

    button:hover {
      filter: brightness(.94);
    }

    button:active {
      transform: scale(.99);
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    button.secondary {
      background: #475569;
    }

    #message,
    #dashboardMessage {
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: auto;
      padding: 25px 8px 0;
      text-align: center;
      line-height: 1.6;
      color: #334b61;
    }

    .footer strong {
      display: block;
      font-size: 16px;
      font-weight: 800;
    }

    .footer span {
      font-size: 14px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      .hero {
        min-height: 235px;
        padding-top: 20px;
      }

      .logo {
        width: 82px;
        height: 82px;
      }

      .page-background {
        min-height: calc(100vh - 235px);
        padding: 24px 14px;
      }

      .card {
        padding: 25px 21px;
        border-radius: 16px;
      }

      h2 {
        font-size: 25px;
      }

      .institution {
        letter-spacing: 0;
      }

      .footer {
        padding-top: 24px;
      }
    }

    .dashboard-menu {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}

.dashboard-menu button {
  margin-top: 0;
}

#dashboardContent {
  margin-top: 24px;
  overflow-x: auto;
}

.calendar-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin: 14px 0;
}

.calendar-toolbar select,
.calendar-toolbar button {
  width: auto;
  min-height: 42px;
  margin-top: 0;
  padding: 9px 13px;
  font-size: 14px;
}

.calendar-table {
  width: 100%;
  border-collapse: collapse;
  background: white;
  font-size: 14px;
}

.calendar-table th,
.calendar-table td {
  padding: 10px;
  border: 1px solid #dbe5e8;
  text-align: left;
  vertical-align: top;
}

.calendar-table th {
  background: #e8f5ef;
  color: #075c43;
}

.calendar-table tr:nth-child(even) {
  background: #f7faf9;
}

    
/* Tabel kalender lebih nyaman dibaca */
#dashboardContent {
  width: 100%;
  min-width: 0;
  overflow-x: auto;
}

.calendar-table {
  min-width: 760px;
  width: 100%;
  table-layout: auto;
  font-size: 13px;
}

.calendar-table th,
.calendar-table td {
  padding: 9px 10px;
  white-space: normal;
  overflow-wrap: anywhere;
}

.calendar-table th {
  position: sticky;
  top: 0;
  z-index: 1;
}

.calendar-note {
  color: #607187;
  font-size: 13px;
  line-height: 1.5;
}

  </style>
</head>

  <script>
    const SUPABASE_URL =
      "https://xqeuklqhkslfvhqrhyyr.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_2hvrRkMS3sZ9CvyHHNdgFA_vsKJj8Mn";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const loginCard = document.getElementById("loginCard");
    const dashboardCard = document.getElementById("dashboardCard");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const dashboardMessage =
      document.getElementById("dashboardMessage");

    let sessionCheckId = 0;
    let currentProfile = null;

    async function showSession(session) {
      const checkId = ++sessionCheckId;

      if (!session) {
        currentProfile = null;
        loginCard.classList.remove("hidden");
        dashboardCard.classList.add("hidden");
        return;
      }

      const { data, error } = await client
        .from("profiles")
        .select("full_name, role, staff_id, is_active")
        .eq("id", session.user.id)
        .maybeSingle();

      if (checkId !== sessionCheckId) return;

      if (error || !data || !data.is_active) {
        await client.auth.signOut();
        message.textContent =
          "Profil belum tersedia atau akun belum aktif. Hubungi administrator.";
        loginCard.classList.remove("hidden");
        dashboardCard.classList.add("hidden");
        return;
      }

      currentProfile = data;
      loginCard.classList.add("hidden");
      dashboardCard.classList.remove("hidden");

      document.getElementById("welcome").textContent =
        "Selamat datang, " + data.full_name +
        " (" + data.role + ").";
    }

    document.getElementById("togglePassword")
      .addEventListener("click", function () {
        const password = document.getElementById("password");
        const isHidden = password.type === "password";

        password.type = isHidden ? "text" : "password";
        this.textContent = isHidden ? "Sembunyikan" : "Lihat";
      });

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      loginButton.disabled = true;
      loginButton.textContent = "Memeriksa akun...";
      message.textContent = "";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email,
          password
        });

        if (error) {
          message.textContent =
            "Login gagal. Periksa email dan password, lalu coba lagi.";
          return;
        }

        message.textContent = "";
        await showSession(data.session);
      } catch (error) {
        message.textContent =
          "Koneksi bermasalah. Periksa internet lalu coba lagi.";
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Masuk";
      }
    });

    
function escapeCalendarText(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function loadCalendar(year) {
  const content = document.getElementById("dashboardContent");

  content.innerHTML = "<p>Memuat kalender " + year + "...</p>";

  const startDate = year + "-01-01";
  const endDate = (year + 1) + "-01-01";

  const { data, error } = await client
    .from("calendar_days")
    .select(
      "calendar_date, day_description, day_type, schedule_policy, verification_status"
    )
    .gte("calendar_date", startDate)
    .lt("calendar_date", endDate)
    .order("calendar_date", { ascending: true })
    .limit(500);

  if (error) {
    content.textContent =
      "Kalender gagal dimuat. Periksa nama kolom dan izin baca tabel calendar_days di Supabase. Detail: " +
      error.message;
    return;
  }

  const rows = (data || []).map(function (day) {
    const date = escapeCalendarText(day.calendar_date);
    const tanggal = new Date(day.calendar_date + "T12:00:00");
    const weekday = tanggal.toLocaleDateString("id-ID", {
                    weekday: "long",
                    timeZone: "Asia/Jakarta"
                    });
    const description = escapeCalendarText(day.day_description || "-");
    const type = escapeCalendarText(day.day_type || "-");
    const policy = escapeCalendarText(day.schedule_policy || "-");
    const verification = escapeCalendarText(
      day.verification_status || "-"
    );

    return `
      <tr>
        <td>${date}</td>
        <td>${weekday}</td>
        <td>${description}</td>
        <td>${type}</td>
        <td>${policy}</td>
        <td>${verification}</td>
      </tr>`;
  }).join("");

  content.innerHTML = `
    <h2>Kalender ${year}</h2>
    <div class="calendar-toolbar">
      <label for="calendarYear">Pilih tahun</label>
      <select id="calendarYear">
        <option value="2026" ${year === 2026 ? "selected" : ""}>2026</option>
        <option value="2027" ${year === 2027 ? "selected" : ""}>2027</option>
      </select>
      <button type="button" id="refreshCalendar">Muat ulang</button>
    </div>
    <p class="calendar-note">
      Data dibaca dari Supabase. Kolom kebijakan menunjukkan apakah
      tanggal diizinkan, diberi peringatan, atau diblokir.
    </p>
    <p>Jumlah tanggal ditemukan: <strong>${(data || []).length}</strong></p>
    <table class="calendar-table">
      <thead>
        <tr>
          <th>Tanggal</th>
          <th>Hari</th>
          <th>Keterangan</th>
          <th>Jenis Hari</th>
          <th>Kebijakan Jadwal</th>
          <th>Verifikasi</th>
        </tr>
      </thead>
      <tbody>
        ${rows || '<tr><td colspan="6">Tidak ada data untuk tahun ini.</td></tr>'}
      </tbody>
    </table>`;

  document.getElementById("calendarYear").addEventListener(
    "change",
    function () {
      loadCalendar(Number(this.value));
    }
  );

  document.getElementById("refreshCalendar").addEventListener(
    "click",
    function () {
      loadCalendar(year);
    }
  );
}

document.getElementById("calendarMenu").addEventListener(
  "click",
  function () {
    loadCalendar(new Date().getFullYear() >= 2026 ? new Date().getFullYear() : 2026);
  }
);

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showDashboardMessage(text, isError = false) {
  dashboardMessage.textContent = text;
  dashboardMessage.style.color = isError ? "#b42318" : "#087f5b";
}

async function fetchActiveMaster(table, columns) {
  const { data, error } = await client
    .from(table)
    .select(columns)
    .eq("is_active", true)
    .order(table === "programs" ? "program_name" : table === "staff" ? "full_name" : "place_name");
  if (error) throw error;
  return data || [];
}

async function loadSchedulePage() {
  const content = document.getElementById("dashboardContent");
  showDashboardMessage("");
  content.innerHTML = "<p>Memuat data jadwal dan data master...</p>";

  try {
    const [programs, staff, places, calendarResult] = await Promise.all([
      fetchActiveMaster("programs", "id, program_code, program_name, is_active"),
      fetchActiveMaster("staff", "id, employee_code, full_name, is_active"),
      fetchActiveMaster("places", "id, place_name, is_active"),
      Promise.resolve(null)
    ]);

    const isPetugas = currentProfile?.role === "petugas";
    if (isPetugas && !currentProfile.staff_id) {
      content.innerHTML = "<h2>Jadwal Kegiatan</h2><p>Akun petugas ini belum terhubung ke data petugas. Hubungi administrator untuk mengisi profil staff_id.</p>";
      return;
    }

    const staffOptions = staff
      .filter(person => !isPetugas || person.id === currentProfile.staff_id)
      .map(person => `<option value="${escapeHtml(person.id)}">${escapeHtml(person.full_name)}${person.employee_code ? " — " + escapeHtml(person.employee_code) : ""}</option>`)
      .join("");
    const programOptions = programs.map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.program_name)}${item.program_code ? " — " + escapeHtml(item.program_code) : ""}</option>`).join("");
    const placeOptions = places.map(item => `<option value="${escapeHtml(item.id)}">${escapeHtml(item.place_name)}</option>`).join("");

    content.innerHTML = `
      <h2>Jadwal Kegiatan</h2>
      <p class="calendar-note">Isi formulir untuk menambahkan jadwal. Minggu dan tanggal berstatus blokir akan ditolak oleh sistem. Jadwal hari Sabtu menampilkan konfirmasi peringatan.</p>
      <form id="scheduleForm">
        <label for="activityDate">Tanggal kegiatan</label>
        <input id="activityDate" type="date" required>
        <label for="programId">Program kegiatan</label>
        <select id="programId" required style="width:100%;min-height:48px;padding:10px;border:1px solid #cbd7e3;border-radius:10px;background:white">
          <option value="">Pilih program</option>${programOptions}
        </select>
        <label for="staffId">Nama petugas</label>
        <select id="staffId" required style="width:100%;min-height:48px;padding:10px;border:1px solid #cbd7e3;border-radius:10px;background:white" ${isPetugas ? "disabled" : ""}>
          <option value="">Pilih petugas</option>${staffOptions}
        </select>
        <label for="placeId">Tempat kegiatan</label>
        <select id="placeId" required style="width:100%;min-height:48px;padding:10px;border:1px solid #cbd7e3;border-radius:10px;background:white">
          <option value="">Pilih tempat</option>${placeOptions}
        </select>
        <label for="scheduleNotes">Catatan (opsional)</label>
        <input id="scheduleNotes" type="text" maxlength="500" placeholder="Keterangan tambahan">
        <button id="saveScheduleButton" type="submit">Simpan Jadwal</button>
      </form>
      <div id="scheduleFormMessage" role="status" aria-live="polite"></div>
      <hr style="margin:26px 0;border:0;border-top:1px solid #dbe5e8">
      <h2>Daftar Jadwal Terbaru</h2>
      <div id="scheduleList"><p>Memuat jadwal...</p></div>`;

    if (isPetugas) document.getElementById("staffId").value = currentProfile.staff_id;
    document.getElementById("scheduleForm").addEventListener("submit", saveSchedule);
    await loadScheduleList(programs, staff, places);
  } catch (error) {
    content.innerHTML = "<h2>Jadwal Kegiatan</h2><p>Data jadwal belum dapat dimuat. Periksa tabel master dan izin akses Supabase.</p>";
    showDashboardMessage("Detail: " + (error.message || "Terjadi kesalahan"), true);
  }
}

async function saveSchedule(event) {
  event.preventDefault();
  const button = document.getElementById("saveScheduleButton");
  const formMessage = document.getElementById("scheduleFormMessage");
  const activityDate = document.getElementById("activityDate").value;
  const programId = document.getElementById("programId").value;
  const staffId = document.getElementById("staffId").value;
  const placeId = document.getElementById("placeId").value;
  const notes = document.getElementById("scheduleNotes").value.trim();

  formMessage.style.color = "#b42318";
  formMessage.textContent = "";
  if (!activityDate || !programId || !staffId || !placeId) {
    formMessage.textContent = "Tanggal, program, petugas, dan tempat wajib diisi.";
    return;
  }

  const chosenDate = new Date(activityDate + "T12:00:00");
  const dayOfWeek = chosenDate.getDay();
  if (dayOfWeek === 0) {
    formMessage.textContent = "Jadwal tidak dapat dibuat pada hari Minggu.";
    return;
  }

  const { data: calendarDay, error: calendarError } = await client
    .from("calendar_days")
    .select("day_description, day_type, schedule_policy, verification_status")
    .eq("calendar_date", activityDate)
    .maybeSingle();

  if (calendarError) {
    formMessage.textContent = "Kebijakan kalender tidak dapat diperiksa: " + calendarError.message;
    return;
  }
  if (!calendarDay) {
    formMessage.textContent = "Tanggal ini belum tersedia di kalender. Hubungi administrator.";
    return;
  }
  if (calendarDay.schedule_policy === "block") {
    formMessage.textContent = "Tanggal diblokir: " + (calendarDay.day_description || activityDate);
    return;
  }
  if (dayOfWeek === 6 || calendarDay.schedule_policy === "warning") {
    const detail = calendarDay.day_description ? " (" + calendarDay.day_description + ")" : "";
    if (!window.confirm("Perhatian: tanggal ini memiliki kebijakan peringatan" + detail + ". Tetap simpan jadwal?")) return;
  }

  button.disabled = true;
  button.textContent = "Menyimpan...";
  try {
    const { error } = await client.from("schedules").insert({
      activity_date: activityDate,
      program_id: programId,
      staff_id: staffId,
      place_id: placeId,
      notes: notes || null,
      status: "valid"
    });
    if (error) {
      let friendly = error.message || "Terjadi kesalahan.";
      if (/duplicate key|schedules_staff_date_unique|unique constraint/i.test(friendly)) {
        friendly = "Petugas tersebut sudah memiliki jadwal pada tanggal itu. Pilih petugas atau tanggal lain.";
      } else if (/row-level security|permission denied/i.test(friendly)) {
        friendly = "Akun Anda tidak memiliki izin untuk menambahkan jadwal ini.";
      }
      formMessage.textContent = "Jadwal belum tersimpan: " + friendly;
      return;
    }
    formMessage.style.color = "#087f5b";
    formMessage.textContent = "Jadwal berhasil disimpan.";
    document.getElementById("scheduleForm").reset();
    if (currentProfile?.role === "petugas" && currentProfile.staff_id) {
      document.getElementById("staffId").value = currentProfile.staff_id;
    }
    await loadScheduleList();
  } catch (error) {
    formMessage.textContent = "Jadwal belum tersimpan: " + (error.message || "Koneksi bermasalah.");
  } finally {
    button.disabled = false;
    button.textContent = "Simpan Jadwal";
  }
}

async function loadScheduleList(programsArg, staffArg, placesArg) {
  const list = document.getElementById("scheduleList");
  if (!list) return;
  list.innerHTML = "<p>Memuat jadwal...</p>";
  try {
    const [scheduleResult, programs, staff, places] = await Promise.all([
      client.from("schedules")
        .select("id, activity_date, program_id, staff_id, place_id, notes, status")
        .eq("status", "valid")
        .order("activity_date", { ascending: false })
        .limit(100),
      programsArg ? Promise.resolve(programsArg) : fetchActiveMaster("programs", "id, program_code, program_name, is_active"),
      staffArg ? Promise.resolve(staffArg) : fetchActiveMaster("staff", "id, employee_code, full_name, is_active"),
      placesArg ? Promise.resolve(placesArg) : fetchActiveMaster("places", "id, place_name, is_active")
    ]);
    if (scheduleResult.error) throw scheduleResult.error;
    const programMap = Object.fromEntries(programs.map(x => [x.id, x.program_name]));
    const staffMap = Object.fromEntries(staff.map(x => [x.id, x.full_name]));
    const placeMap = Object.fromEntries(places.map(x => [x.id, x.place_name]));
    const rows = (scheduleResult.data || []).map(item => `
      <tr>
        <td>${escapeHtml(item.activity_date)}</td>
        <td>${escapeHtml(programMap[item.program_id] || "Program tidak ditemukan")}</td>
        <td>${escapeHtml(staffMap[item.staff_id] || "Petugas tidak ditemukan")}</td>
        <td>${escapeHtml(placeMap[item.place_id] || "Tempat tidak ditemukan")}</td>
        <td>${escapeHtml(item.notes || "-")}</td>
      </tr>`).join("");
    list.innerHTML = `<table class="calendar-table"><thead><tr><th>Tanggal</th><th>Program</th><th>Petugas</th><th>Tempat</th><th>Catatan</th></tr></thead><tbody>${rows || '<tr><td colspan="5">Belum ada jadwal yang tersimpan.</td></tr>'}</tbody></table><p class="calendar-note">Menampilkan maksimal 100 jadwal valid terbaru.</p>`;
  } catch (error) {
    list.innerHTML = "<p>Daftar jadwal belum dapat dimuat. Detail: " + escapeHtml(error.message || "Terjadi kesalahan") + "</p>";
  }
}

async function loadMasterPage() {
  const content = document.getElementById("dashboardContent");
  showDashboardMessage("");
  content.innerHTML = "<p>Memuat data master...</p>";
  try {
    const [programs, staff, places] = await Promise.all([
      fetchActiveMaster("programs", "id, program_code, program_name, is_active"),
      fetchActiveMaster("staff", "id, employee_code, full_name, is_active"),
      fetchActiveMaster("places", "id, place_name, is_active")
    ]);
    const renderTable = (title, headers, rows) => `<h2 style="margin-top:24px">${title} (${rows.length})</h2><table class="calendar-table"><thead><tr>${headers.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell || "-")}</td>`).join("")}</tr>`).join("") || `<tr><td colspan="${headers.length}">Tidak ada data.</td></tr>`}</tbody></table>`;
    content.innerHTML = `<h2>Data Master</h2><p class="calendar-note">Data berikut dibaca dari Supabase. Pengubahan data master belum tersedia di halaman ini.</p>` +
      renderTable("Program", ["Kode", "Nama Program"], programs.map(x => [x.program_code, x.program_name])) +
      renderTable("Petugas", ["Kode Petugas", "Nama Petugas"], staff.map(x => [x.employee_code, x.full_name])) +
      renderTable("Tempat", ["Nama Tempat"], places.map(x => [x.place_name]));
  } catch (error) {
    content.innerHTML = "<h2>Data Master</h2><p>Data master gagal dimuat. Detail: " + escapeHtml(error.message || "Terjadi kesalahan") + "</p>";
  }
}

document.getElementById("scheduleMenu").addEventListener("click", loadSchedulePage);
document.getElementById("masterMenu").addEventListener("click", loadMasterPage);

    document.getElementById("logoutButton")
      .addEventListener("click", async function () {
        const { error } = await client.auth.signOut();

        if (error) {
          dashboardMessage.textContent =
            "Gagal keluar. Silakan coba lagi.";
          return;
        }

        dashboardMessage.textContent = "";
        message.textContent = "";
        await showSession(null);
      });

    client.auth.onAuthStateChange((_event, session) => {
      showSession(session);
    });

    client.auth.getSession().then(({ data, error }) => {
      if (error) {
        message.textContent =
          "Sesi tidak dapat diperiksa. Silakan muat ulang halaman.";
        return;
      }
      showSession(data.session);
    });
  </script>
</body>
